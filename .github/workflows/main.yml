name: Update Zawamil Data

on:
  schedule:
    - cron: '0 0 * * *' # يعمل مرة يومياً بتوقيت غرينتش
  workflow_dispatch: # زر للتشغيل اليدوي من الموقع

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
    # استخدام الإصدار الرابع (v4) كما طلبت
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run scraper
      run: python scraper.py
    
    - name: Commit changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add data.json
        git diff --quiet && git diff --staged --quiet || git commit -m "Update zawamil data" -a
        git push
